    <path d="M200 24 L352.4 112 L288 149 L200 98 Z" fill="#FFFFFF" opacity="0.08"/>
    <path d="M47.6 112 L112 149 L200 376 L47.6 288 Z" fill="#003E46" opacity="0.14"/>
    <path d="M352.4 112 L288 149 L200 376 L352.4 288 Z" fill="#003E46" opacity="0.20"/>
    <path d="M112 149 L200 98 L288 149 L200 376 Z" fill="#FFFFFF" opacity="0.07"/>
    <path d="M200 24 L352.4 112 L352.4 288 L200 376 L47.6 288 L47.6 112 Z" fill="none" stroke="#DDFBFF" stroke-width="6" opacity="0.78"/>
    <text x="203" y="264" text-anchor="middle" font-size="142" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-10.65" fill="#FFFFFF">JST</text>
  </g>

  <g transform="translate(560, 235)">
