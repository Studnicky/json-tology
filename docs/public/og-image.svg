    <text x="0" y="62" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="500" fill="#7FE7D8" opacity="0.85">One source of truth.</text>
    <text x="0" y="100" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="500" fill="#7FE7D8" opacity="0.85">TypeScript types · validation · OWL ontology.</text>
    <text x="0" y="180" font-size="22" font-family="'SF Mono', Menlo, Consolas, monospace" font-weight="500" fill="#BDF6F2" opacity="0.6">Author in JSON Schema. Reason over the graph.</text>
