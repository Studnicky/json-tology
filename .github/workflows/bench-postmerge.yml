name: Benchmarks (Post-Merge)

# Slow tier: bench runs on main pushes only.
# Does NOT gate PRs — runner variance on shared hardware is too high
# to be a reliable signal at the resolution we measure.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  bench:
    name: Run benchmark suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TSX_CACHE: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/node-setup

      - name: Run benchmarks (report mode)
        env:
          TSX_CACHE: 1
        run: npm run bench:report

      - name: Capture environment metadata
        if: always()
        run: |
          echo "Runner: ${RUNNER_OS}" > examples/docs/benchmarks/results/run-meta.txt
          echo "Workflow: ${GITHUB_WORKFLOW}" >> examples/docs/benchmarks/results/run-meta.txt
          echo "Commit: ${GITHUB_SHA}" >> examples/docs/benchmarks/results/run-meta.txt
          echo "Ref: ${GITHUB_REF}" >> examples/docs/benchmarks/results/run-meta.txt

      - name: Upload bench report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-results-${{ github.run_id }}
          path: examples/docs/benchmarks/results/
          if-no-files-found: error
          retention-days: 90
