name: Benchmarks (Post-Merge)

# Slow tier: bench runs on main pushes only.
# Does NOT gate PRs — runner variance on shared hardware is too high
# to be a reliable signal at the resolution we measure.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Run benchmark suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TSX_CACHE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks (report mode)
        env:
          TSX_CACHE: 1
        run: npm run bench:report

      - name: Capture environment metadata
        if: always()
        run: |
          echo "Runner: ${RUNNER_OS}" > bench/results/run-meta.txt
          echo "Workflow: ${GITHUB_WORKFLOW}" >> bench/results/run-meta.txt
          echo "Commit: ${GITHUB_SHA}" >> bench/results/run-meta.txt
          echo "Ref: ${GITHUB_REF}" >> bench/results/run-meta.txt

      - name: Upload bench report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.run_id }}
          path: bench/results/
          if-no-files-found: error
          retention-days: 90
