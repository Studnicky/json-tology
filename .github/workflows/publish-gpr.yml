name: Publish to GitHub Packages

on:
  # A release created by release.yml runs under GITHUB_TOKEN and does NOT cascade
  # `release: published` to this workflow, so the tag push is the reliable trigger:
  # `git push origin vX.Y.Z` (a human/CLI push) fires this job. `release:` is kept
  # for releases created by a human/PAT; `workflow_dispatch` for manual re-runs.
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Dedupe: if a human/PAT release fires both `push: tags` and `release: published`
# for the same version, serialize so only one publish attempt runs per ref.
concurrency:
  group: publish-gpr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-gpr:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/node-setup
        with:
          registry-url: 'https://npm.pkg.github.com'
          scope: '@studnicky'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test

      - name: Rewrite package name to scoped form for GitHub Packages
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.name='@studnicky/json-tology';p.publishConfig={...(p.publishConfig||{}),registry:'https://npm.pkg.github.com'};fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Check if version already published
        id: check-version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "already=true" >> $GITHUB_OUTPUT
          else
            echo "already=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.check-version.outputs.already == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --provenance --access public
