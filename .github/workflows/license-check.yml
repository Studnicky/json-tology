name: License Check

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  detect_changes:
    name: Detect Changes
    uses: ./.github/workflows/detect-changes.yml

  license-check:
    name: Validate Dependency Licenses
    needs: [detect_changes]
    if: ${{ github.event_name != 'pull_request' || needs.detect_changes.outputs.deps == 'true' || needs.detect_changes.outputs.ci_config == 'true' }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      - name: Check dependency licenses
        id: license-check
        run: |
          npx license-checker-rseidelsohn \
            --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.1;LGPL-3.0;UNLICENSED" \
            --summary 2>&1 | tee license-report.txt

      - name: Comment on PR (if violations found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('license-report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## License Compliance Issue\n\nSome dependencies have unapproved licenses:\n\n\`\`\`\n${report}\n\`\`\`\n\nReview the dependency or find an alternative package.`
            });

    timeout-minutes: 15
