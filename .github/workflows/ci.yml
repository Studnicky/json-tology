name: CI

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

jobs:
  smoke-fast:
    name: Smoke (Fast)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TSX_CACHE: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: '24'

      - name: Validate package-lock.json sync
        run: |
          if ! npm ci --dry-run 2>&1 | tee /tmp/npm-ci-output.txt; then
            if grep -q "npm ci.*can only install packages when.*in sync" /tmp/npm-ci-output.txt; then
              echo "::error::package-lock.json is out of sync with package.json"
              echo "Run 'npm install' locally, commit package-lock.json, and push."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Build (so generated example fixtures can import 'json-tology')
        run: npm run build

      - name: Check bookstore graph data is in sync
        run: npm run build:bookstore-tbox:check

      - name: Run smoke tests
        env:
          TSX_CACHE: 1
        run: npm run test:smoke

    timeout-minutes: 5

  unit-integration:
    name: Unit & Integration (${{ matrix.task }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [unit, integration, type-check]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TSX_CACHE: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: '24'

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Build
        if: matrix.task == 'type-check'
        run: npm run build

      - name: Run task
        env:
          TSX_CACHE: 1
        run: |
          case "${{ matrix.task }}" in
            unit)        npm run test:unit ;;
            integration) npm run test:integration ;;
            type-check)  npm run type-check ;;
          esac

    timeout-minutes: 10

  e2e-types:
    name: E2E & Types (${{ matrix.task }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [e2e, types]
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TSX_CACHE: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: '24'

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Build
        run: npm run build

      - name: Type-check the type-test suite
        if: matrix.task == 'types'
        run: npm run type-check:tests

      - name: Run task
        env:
          TSX_CACHE: 1
        run: |
          case "${{ matrix.task }}" in
            e2e)   npm run test:e2e ;;
            types) npm run test:types ;;
          esac

    timeout-minutes: 10

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: '24'

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: ESLint
        run: npx eslint .

    timeout-minutes: 10

  static-analysis:
    name: Static Analysis
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: '24'

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Check circular dependencies
        run: npx madge --circular src/

    timeout-minutes: 10

  ci-gate:
    if: always()
    name: CI Gate
    needs: [smoke-fast, unit-integration, e2e-types, lint, static-analysis]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke (Fast) | ${{ needs.smoke-fast.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit & Integration | ${{ needs.unit-integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E & Types | ${{ needs.e2e-types.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> $GITHUB_STEP_SUMMARY

          FAILED=""
          if [[ "${{ needs.smoke-fast.result }}" != "success" ]]; then
            FAILED="$FAILED  - Smoke (Fast) (${{ needs.smoke-fast.result }})\n"
          fi
          if [[ "${{ needs.unit-integration.result }}" != "success" ]]; then
            FAILED="$FAILED  - Unit & Integration (${{ needs.unit-integration.result }})\n"
          fi
          if [[ "${{ needs.e2e-types.result }}" != "success" ]]; then
            FAILED="$FAILED  - E2E & Types (${{ needs.e2e-types.result }})\n"
          fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            FAILED="$FAILED  - Lint (${{ needs.lint.result }})\n"
          fi
          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then
            FAILED="$FAILED  - Static Analysis (${{ needs.static-analysis.result }})\n"
          fi

          if [[ -n "$FAILED" ]]; then
            echo "CI failed:"
            echo -e "$FAILED"
            exit 1
          fi

          echo "All CI jobs passed."
    timeout-minutes: 2
