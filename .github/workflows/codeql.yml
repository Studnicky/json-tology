name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Probe GHAS availability
        id: probe
        uses: ./.github/actions/gh-api-probe
        with:
          path: repos/${{ github.repository }}/code-scanning/alerts

      # The default-setup endpoint may require repo-admin access GITHUB_TOKEN
      # doesn't have, regardless of the `permissions:` granted above — fail
      # closed (assume "configured", skip the scan) on any error rather than
      # falling through to "not-configured" and hitting the same SARIF
      # rejection this check exists to avoid.
      - name: Check code-scanning default setup
        id: default-setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/code-scanning/default-setup" --jq '.state' 2>/dev/null || echo "configured")
          echo "state=$state" >> "$GITHUB_OUTPUT"

      # GitHub's automatic "default setup" CodeQL scanning and this workflow's
      # custom ("advanced configuration") scan are mutually exclusive — a SARIF
      # upload from an advanced configuration is rejected outright while default
      # setup is active for the same language. Skip entirely rather than upload
      # a scan GitHub will refuse to process.
      - name: Initialize CodeQL
        if: steps.probe.outputs.enabled == 'true' && steps.default-setup.outputs.state != 'configured'
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        if: steps.probe.outputs.enabled == 'true' && steps.default-setup.outputs.state != 'configured'
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: /language:${{ matrix.language }}
