name: Publish Package

on:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate Before Publish
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      - name: Verify version-stamped SVGs are in sync
        run: npm run stamp-version:check

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npx eslint .

      - name: Run tests
        run: npm test

    timeout-minutes: 15

  publish:
    needs: validate
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    outputs:
      published: ${{ steps.publish-package.outputs.published }}
      version: ${{ steps.check-version.outputs.version }}
    permissions:
      contents: read
      packages: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup
        with:
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Validate changelog has version entry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -f CHANGELOG.md ] && ! grep -qE "^## \[?${VERSION}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain entry for version ${VERSION}"
            exit 1
          fi

      - name: Check if version already published
        id: check-version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> $GITHUB_OUTPUT

          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "Version ${PKG_VERSION} already published, skipping"
            echo "already_published=true" >> $GITHUB_OUTPUT
          else
            echo "Version ${PKG_VERSION} not found, will publish"
            echo "already_published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        id: publish-package
        if: steps.check-version.outputs.already_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --provenance --access public
          echo "published=true" >> $GITHUB_OUTPUT

    timeout-minutes: 15
