name: Release version

# Fires on push to a release/** branch. Consumes every pending changeset
# (bumps package.json, folds changeset content into CHANGELOG.md), stamps
# the version SVGs, and commits + pushes the result back to the same
# release branch. Tagging and the GitHub release happen later, after this
# branch is merged to main (see release.yml).

on:
  push:
    branches: ['release/**']

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }

      - uses: ./.github/actions/node-setup

      - name: Consume changesets
        run: npx changeset version

      - name: Stamp version SVGs
        run: npm run stamp-version

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::Release stamping did not change any tracked files."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: release v${VERSION}"
          git push origin HEAD:${{ github.ref_name }}
