name: Publish GitHub release

# Fires when a version tag is pushed. Reads the matching CHANGELOG section
# and the per-tag stamped README/OG SVGs, composes a release body, and
# creates or updates the GitHub release. The SVG URL uses the tag ref so
# each release page renders the version that was stamped at tag time.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)publish a release for (e.g. v0.9.0)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG='${{ inputs.tag }}'
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify stamped SVGs match tag version
        run: |
          EXPECTED='${{ steps.tag.outputs.tag }}'
          for svg in docs/public/og-image.svg docs/public/readme-header.svg; do
            STAMPED=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' "$svg" | head -1 || true)
            if [ "$STAMPED" != "$EXPECTED" ]; then
              echo "::error::$svg carries '$STAMPED' but the tag is '$EXPECTED'. Run 'node scripts/stamp-version.mjs' before tagging."
              exit 1
            fi
          done

      - name: Extract CHANGELOG section
        run: |
          VERSION='${{ steps.tag.outputs.version }}'
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]?" { capture = 1; next }
            capture && /^## /       { exit }
            capture                 { print }
          ' CHANGELOG.md > /tmp/section.md
          if [ ! -s /tmp/section.md ]; then
            echo "::error::No CHANGELOG section found for [$VERSION]"
            exit 1
          fi

      - name: Compose release body
        id: body
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          REPO='${{ github.repository }}'
          HEADER_URL="https://raw.githubusercontent.com/${REPO}/${TAG}/docs/public/readme-header.svg"
          {
            echo "<p align=\"center\"><img src=\"${HEADER_URL}\" alt=\"json-tology ${TAG}\" width=\"640\" /></p>"
            echo
            cat /tmp/section.md
          } > /tmp/body.md
          echo "path=/tmp/body.md" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ steps.tag.outputs.tag }}'
          if gh release view "$TAG" --repo '${{ github.repository }}' >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --repo '${{ github.repository }}' \
              --title "$TAG" \
              --notes-file '${{ steps.body.outputs.path }}'
          else
            gh release create "$TAG" \
              --repo '${{ github.repository }}' \
              --title "$TAG" \
              --notes-file '${{ steps.body.outputs.path }}'
          fi
