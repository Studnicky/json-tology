name: Security Audit

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  detect_changes:
    name: Detect Changes
    uses: ./.github/workflows/detect-changes.yml

  security-audit:
    name: Security Vulnerability Scan
    needs: [detect_changes]
    if: ${{ github.event_name != 'pull_request' || needs.detect_changes.outputs.deps == 'true' || needs.detect_changes.outputs.ci_config == 'true' }}
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/node-setup

      - name: Run security audit (production deps only)
        run: npm audit --audit-level=high --omit=dev

      - name: Generate full audit report (incl. dev)
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

    timeout-minutes: 15
