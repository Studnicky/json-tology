name: Code Coverage

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  coverage:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: ./.github/actions/node-setup

      - name: Build
        run: npm run build

      - name: Run tests with coverage (threshold-gated)
        # Measure SOURCE coverage across unit + integration (integration exercises
        # the projection/SHACL paths that unit alone misses). Exclude built dist
        # artifacts and the test files themselves so the numbers reflect src/, and
        # fail the job if coverage regresses below the floor. pipefail preserves
        # the test runner's exit code through the tee pipe.
        run: |
          set -o pipefail
          npx tsx --test --experimental-test-coverage \
            --test-coverage-exclude='**/dist/**' \
            --test-coverage-exclude='test/**' \
            --test-coverage-lines=96 \
            --test-coverage-branches=87 \
            --test-coverage-functions=89 \
            'test/smoke/**/*.test.ts' \
            'test/unit/**/*.test.ts' \
            'test/integration/**/*.test.ts' \
            2>&1 | tee coverage-report.txt

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-report.txt
          retention-days: 30

    timeout-minutes: 15
